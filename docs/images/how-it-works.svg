<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 486" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- solid light card so dark text stays legible on any page background -->
  <rect x="0" y="0" width="960" height="486" rx="14" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="959" height="485" rx="14" fill="none" stroke="#d8dee4" stroke-width="1"/>

  <!-- title -->
  <text x="32" y="42" font-size="21" font-weight="700" fill="#1b2733">limes — one decision core, on the seam between your agent and its tools</text>
  <text x="32" y="66" font-size="13.5" fill="#5b6b7b">checked both ways: injection reaching your model from a tool, and every action before it runs — never a silent “ok”</text>

  <!-- boxes -->
  <rect x="32" y="150" width="168" height="152" rx="10" fill="#f4f7fa" stroke="#cbd5e0" stroke-width="1.2"/>
  <text x="116" y="220" font-size="15" font-weight="700" fill="#1b2733" text-anchor="middle">HOST</text>
  <text x="116" y="241" font-size="12.5" fill="#5b6b7b" text-anchor="middle">your model</text>

  <rect x="360" y="120" width="240" height="212" rx="12" fill="#eef4ff" stroke="#5a7fb5" stroke-width="1.6"/>
  <text x="480" y="150" font-size="16" font-weight="700" fill="#1b3a63" text-anchor="middle">limes</text>
  <text x="480" y="171" font-size="12" fill="#3f5a7a" text-anchor="middle">runs detectors, returns a Verdict</text>
  <line x1="384" y1="184" x2="576" y2="184" stroke="#c3d3ea" stroke-width="1"/>
  <rect x="378" y="196" width="70" height="26" rx="13" fill="#e4f4ea" stroke="#57a06f" stroke-width="1.1"/>
  <text x="413" y="213" font-size="12" font-weight="600" fill="#2f7c4c" text-anchor="middle">Allow</text>
  <rect x="454" y="196" width="66" height="26" rx="13" fill="#fbe6e6" stroke="#c56a6a" stroke-width="1.1"/>
  <text x="487" y="213" font-size="12" font-weight="600" fill="#a83e3e" text-anchor="middle">Deny</text>
  <rect x="526" y="196" width="70" height="26" rx="13" fill="#fdf2df" stroke="#c79a4a" stroke-width="1.1"/>
  <text x="561" y="213" font-size="11" font-weight="600" fill="#8a6a1f" text-anchor="middle">CannotSay</text>
  <rect x="378" y="236" width="218" height="80" rx="9" fill="#ffffff" stroke="#c3d3ea" stroke-width="1"/>
  <text x="487" y="260" font-size="12.5" font-weight="700" fill="#1b3a63" text-anchor="middle">hash-chained ledger</text>
  <text x="487" y="280" font-size="11" fill="#5b6b7b" text-anchor="middle">every decision — allow, deny,</text>
  <text x="487" y="296" font-size="11" fill="#5b6b7b" text-anchor="middle">cannot-say — appended, replayable</text>

  <rect x="760" y="150" width="168" height="152" rx="10" fill="#f4f7fa" stroke="#cbd5e0" stroke-width="1.2"/>
  <text x="844" y="220" font-size="15" font-weight="700" fill="#1b2733" text-anchor="middle">MCP SERVER</text>
  <text x="844" y="241" font-size="12.5" fill="#5b6b7b" text-anchor="middle">your tools</text>

  <!-- TOP leg: outgoing — your model calls a tool (the action) -->
  <text x="280" y="146" font-size="11.5" font-weight="700" fill="#3f5a7a" text-anchor="middle">OUTGOING</text>
  <line x1="200" y1="170" x2="348" y2="170" stroke="#5b6b7b" stroke-width="1.8"/>
  <polygon points="358,170 348,165 348,175" fill="#5b6b7b"/>
  <text x="278" y="188" font-size="11" fill="#5b6b7b" text-anchor="middle">checked before it runs</text>
  <line x1="602" y1="170" x2="748" y2="170" stroke="#5b6b7b" stroke-width="1.8"/>
  <polygon points="758,170 748,165 748,175" fill="#5b6b7b"/>
  <text x="680" y="188" font-size="11" fill="#5b6b7b" text-anchor="middle">runs if clean</text>
  <line x1="358" y1="212" x2="212" y2="212" stroke="#a83e3e" stroke-width="1.6" stroke-dasharray="5 4"/>
  <polygon points="202,212 212,207 212,217" fill="#a83e3e"/>
  <text x="278" y="230" font-size="11" fill="#a83e3e" text-anchor="middle">blocked, returned as isError</text>

  <!-- BOTTOM leg: incoming — a tool answers your model (the content) -->
  <text x="680" y="268" font-size="11.5" font-weight="700" fill="#3f5a7a" text-anchor="middle">INCOMING</text>
  <line x1="758" y1="292" x2="612" y2="292" stroke="#5b6b7b" stroke-width="1.8"/>
  <polygon points="602,292 612,287 612,297" fill="#5b6b7b"/>
  <text x="680" y="310" font-size="11" fill="#5b6b7b" text-anchor="middle">a result or tool listing</text>
  <line x1="358" y1="292" x2="212" y2="292" stroke="#5b6b7b" stroke-width="1.8"/>
  <polygon points="202,292 212,287 212,297" fill="#5b6b7b"/>
  <text x="278" y="310" font-size="11" fill="#5b6b7b" text-anchor="middle">before your model reads it</text>

  <!-- legend, structured: two directions, which detector runs on each -->
  <line x1="32" y1="356" x2="928" y2="356" stroke="#e2e8ee" stroke-width="1"/>
  <text x="32" y="380" font-size="12" font-weight="700" fill="#1b2733">Detectors</text>
  <text x="120" y="380" font-size="11.5" fill="#8a97a5">— rules as data; arithmetic (Luhn, MOD 97-10, the NIR key) where a regex cannot decide</text>

  <rect x="32" y="392" width="104" height="24" rx="6" fill="#eef4ff" stroke="#c3d3ea" stroke-width="1"/>
  <text x="84" y="408" font-size="11" font-weight="700" fill="#1b3a63" text-anchor="middle">outgoing</text>
  <text x="150" y="408" font-size="11.5" fill="#3f5a7a">the tool call your model makes — injection, checked before the action runs</text>

  <rect x="32" y="422" width="104" height="24" rx="6" fill="#eef4ff" stroke="#c3d3ea" stroke-width="1"/>
  <text x="84" y="438" font-size="11" font-weight="700" fill="#1b3a63" text-anchor="middle">incoming</text>
  <text x="150" y="438" font-size="11.5" fill="#3f5a7a">what a tool sends back — injection-egress (poisoned tools), pii-egress, secrets-egress</text>

  <text x="32" y="470" font-size="10.5" fill="#8a97a5">One core, used in-process or behind the MCP stdio / HTTP proxy · Apache-2.0 · one runtime dependency</text>
</svg>
