# limes — egress detection policy (ADR 0004: rules are data, never Python).
#
# Every rule is a SHAPE plus a CHECK. The shape says which runs of text are even
# looked at; the check says whether the shape meant anything. The check is named
# from a closed registry (limes.detectors.egress_policy.VALIDATORS) — an unknown
# name is a load error, never a rule that matches a shape and vouches for nothing.
#
# `validator: none` is a rule declaring, out loud, that its shape is the whole
# claim. `retry_trim: true` lets a candidate that failed its check be retried
# after dropping its trailing group — prose runs an IBAN into the next word, and
# the retry can only ever SHORTEN a candidate, never loosen the check.
#
# The half of a label before the colon is the egress KIND the transport policies
# by (ADR 0006): `pii:pan` is kind `pii`.
#
# The corpus that admits these rules is synthetic by construction and may never
# hold a real value (ADR 0009).

version: 1

detectors:

  # -- pii-egress (ADR 0003 admission: eval/matrices/pii_egress.md) ------------
  #
  # Five fixed categories. Not configurable: a deployment that could add a
  # category could add one nobody measured, and an unmeasured category is a
  # capability claimed and never proven.
  pii-egress:
    # Beyond this many characters the detector does not scan, and says so:
    # DetectorBlind -> CannotSay -> the egress leg blocks. Declared here rather
    # than hard-coded because it is a real operational trade-off (an unbounded
    # regex sweep over an unbounded tool result is a denial-of-service surface),
    # and because "I did not look at this" must be auditable data, not a magic
    # number. Never a silent "nothing found" (ADR 0002).
    max_content_chars: 200000
    rules:

      # Card number. 13-19 digits with at most one space / no-break space /
      # hyphen between them, gated by the ISO/IEC 7812 check digit — which is
      # what tells a card number from a 16-digit order reference. The trailing
      # lookahead keeps it off decimal amounts (a ",45" tail marks money).
      - label: pii:pan
        validator: luhn
        retry_trim: false
        pattern: '(?<![A-Za-z0-9+])\d(?:[ \xa0-]?\d){12,18}(?![A-Za-z0-9]|[.,]\d)'

      # IBAN. Deliberately broad shape — two letters, two check digits, then up
      # to thirty grouped alphanumerics — because precision comes from MOD 97-10
      # (ISO 13616), not from the shape. `retry_trim` recovers the very common
      # case of prose running straight into the account number ("...0130 00 EUR").
      - label: pii:iban
        validator: iban_mod97
        retry_trim: true
        pattern: '\b[A-Z]{2}\d{2}(?:[ \xa0]?[A-Z0-9]){10,30}\b'

      # E-mail address. The shape IS the claim here: there is no checksum in an
      # address, and requiring a local part, an "@", a labelled domain and a
      # 2+-letter TLD is already what rejects "jean.dupont@" and "@example.com".
      #
      # The leading lookbehind is a COST gate, not a precision one (ADR 0023).
      # Without it the local part could start at every character of a run,
      # and each start re-scanned the run looking for an "@" that was not
      # there: 43 seconds on 200 000 letters — inside the declared budget, on
      # the proxy's event loop, from one hostile tool result. Starting only
      # where a run starts makes the scan linear, and locates every address
      # the old shape located: an address preceded by a local-part character
      # was already part of that longer local part.
      - label: pii:email
        validator: none
        retry_trim: false
        pattern: '(?<![A-Za-z0-9._%+-])[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}'

      # Telephone: French, German, and E.164 international, as one category with
      # three alternatives. The check is a digit count in the E.164 range (9-15),
      # which is what keeps a date, a reference or an amount out of the findings.
      #
      # Kept on ONE line on purpose: a YAML folded scalar (`>-`) turns each line
      # break into a SPACE, which lands inside the regex and silently requires a
      # trailing space after every alternative. That shape passed the positive
      # corpus (prose usually has a space there) and would have missed a number
      # at the end of a sentence.
      #
      # The second lookbehind is precision, bought from the external bench (ADR
      # 0021 Am. 2). A telephone number does not CONTINUE a run of digit groups:
      # in `DE00 3704 0044 0532 0130 00` the tail `0532 0130 00` is eleven digits,
      # inside E.164's range, and passes this rule's own validator — it is a
      # fragment of an account number, not a number. Rejecting a candidate whose
      # immediately preceding token is a DIGIT group costs nothing measurable
      # (6/6 internal and 66/66 external positives held) and takes limes' single
      # published internal false positive to zero.
      #
      # It is deliberately digits-only. Extending it to any upper-case group
      # killed all six external decoy false positives at zero measured cost too —
      # and the measurement was blind: no corpus here contains an upper-case label
      # before a number, so `TEL 06 12 34 56 78` and `CONTACT +33 6 12 34 56 78`
      # were silently missed. Those cases are now IN the positive corpus, so the
      # next person's number can see what this one could not (ADR 0026).
      - label: pii:phone
        validator: phone_digits
        retry_trim: false
        pattern: '(?<![A-Za-z0-9+])(?<![0-9][ \xa0])(?:(?:\+33[ \xa0.-]?|0)[1-9](?:[ \xa0.-]?\d{2}){4}|(?:\+49[ \xa0.-]?|0)[1-9]\d{1,4}[ \xa0./-]?\d{3,9}|\+[1-9]\d{0,2}[ \xa0.-]?(?:\d[ \xa0.-]?){5,12}\d)(?![A-Za-z0-9])'

      # French social-security number (NIR). Fifteen characters, the last two a
      # control key equal to 97 - (body mod 97) — with Corsica's 2A / 2B
      # department codes substituted before the arithmetic.
      - label: pii:nir
        validator: nir_key
        retry_trim: false
        pattern: '(?<![A-Za-z0-9])[12][ \xa0.]?\d{2}[ \xa0.]?\d{2}[ \xa0.]?(?:\d{2}|2[AB])[ \xa0.]?\d{3}[ \xa0.]?\d{3}[ \xa0.]?\d{2}(?![A-Za-z0-9])'

  # -- secrets-egress (ADR 0003 admission: eval/matrices/secrets_egress.md) ----
  #
  # PREFIXED credentials, PEM private-key armour, JWTs — and one CONTEXT-ANCHORED
  # format, the AWS secret access key (ADR 0022). What is DELIBERATELY absent is
  # the obvious feature: generic high-entropy scanning. A UUID, a git digest, a
  # base64 blob and a content hash are all high-entropy and none is a secret, so
  # an entropy rule with no context is a false-positive generator that teaches
  # its operator to switch the detector off. And ADR 0021 Am. 2 measured that no
  # entropy threshold can even exist here: ADR 0009 makes limes' own positives
  # placeholders, so a gate that rejects placeholder bodies rejects the corpus.
  #
  # Consequence, stated: a BARE unprefixed credential — a database password, a
  # bare bearer token, a forty-character blob with no keyword in reach — is NOT
  # detected, at a measured price rather than a preference: the bare-body rule
  # kills 17/20 hard lookalikes and 15/339 of gitleaks' own negatives (ADR 0022).
  # The benign corpus is what proves the rules that are here do not fire on the
  # lookalikes.
  secrets-egress:
    max_content_chars: 200000
    rules:

      # AWS access key id. The four-letter type prefix is assigned by AWS and is
      # what makes this high-precision without a checksum: twenty upper-case
      # alphanumerics on their own are an order code, `AKIA` + sixteen is a key.
      #
      # The prefixes are AWS's documented unique-id prefixes PLUS the `A3T…`
      # family, which AWS's own git-secrets pattern names and the prefix
      # documentation does not. The head-to-head (ADR 0030) drew the catalogue
      # instance `A3TR…` and this rule, listing only the documented prefixes,
      # missed it — a real gap, closed under ADR 0030 Am. 1 at no measured
      # price: none of gitleaks' 339 negatives and none of limes' own lookalikes
      # carries the shape.
      - label: secret:aws-access-key-id
        validator: none
        retry_trim: false
        pattern: '(?<![A-Za-z0-9])(?:A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA|AGPA|AIDA|AIPA|ANPA|ANVA|AROA)[0-9A-Z]{16}(?![A-Za-z0-9])'

      # AWS *secret* access key — the other half of the pair, and the first
      # CONTEXT-ANCHORED rule (ADR 0022). The value is forty base64 characters
      # with no assigned prefix, so the body alone is indistinguishable from a
      # git SHA-1, a content digest or a cache key — measured: a bare-body rule
      # kills 17/20 of the hard benign corpus, 15/339 of gitleaks' negatives and
      # 3 of limes' own lookalikes. What separates a credential from an artefact
      # here is the NAME IT IS ASSIGNED TO, so the shape is gitleaks' own
      # semi-generic assignment grammar (MIT, transcribed from the vendored
      # catalogue — cloudflare-api-key and gitter-access-token carry the same
      # machinery; \x27 is an apostrophe, escaped for this single-quoted YAML):
      # keyword, up to twenty identifier characters, an assignment operator,
      # optional quoting, the exactly-forty body, a terminator. The operator is
      # the discriminant the proximity idea lacks: "keyword within 40 chars of a
      # body" was measured and REFUSED at 14/20 hard lookalikes killed.
      #
      # The keywords are AWS's own vocabulary, never the generic list:
      # aws…secret…key as one identifier (aws_secret_access_key, aws.secretKey,
      # cloud.aws.credentials.secretKey), "secret access key" as prose or
      # CamelCase (SecretAccessKey — the STS response field), and bare
      # secret_key (Terraform's provider argument, MinIO). The generic keyword
      # list (access|api|key|token|…) was measured and REFUSED: 11/20 hard
      # lookalikes killed and 3 of gitleaks' negatives — a password hash, a
      # cache key, an ARN resource tail (eval/matrices + ADR 0022).
      #
      # `value_group` narrows the finding to the credential itself: the mask
      # must cover the value, not the line that names it. The validator refuses
      # a body that is one unbroken HEX run — a charset property, not an entropy
      # threshold: a real secret is base64 over thirty random bytes (all-hex
      # probability 2^-80), while what actually sits behind these keywords at
      # forty hex characters is a fingerprint or a pinned SHA-1 by construction.
      #
      # Declared misses, measured and left (tests pin them): a space-separated
      # carrier with no operator (`ENV AWS_SECRET_ACCESS_KEY <v>`, `aws
      # configure set … <v>`), a bracketed key (`os.environ["…"] = "<v>"` — the
      # ] is outside the vendor grammar's classes), and a positional argument
      # (`Aws::Credentials.new('AKIA…', '<v>')` — no keyword adjoins the value).
      # The BARE body with no keyword at all is out of scope by measurement, not
      # by preference: ADR 0022 records why no rule can hold it under ADR 0009.
      - label: secret:aws-secret-access-key
        validator: not_pure_hex
        retry_trim: false
        value_group: secret
        pattern: '(?i)[\w.-]{0,50}?(?:aws[\w.-]{0,15}?secret[\w.-]{0,15}?key|secret[ _.-]?access[ _.-]?key|secret[_.-]?key)(?:[ \t\w.-]{0,20})[\s\x27"]{0,3}(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)[\x60\x27"\s=]{0,5}(?P<secret>[A-Za-z0-9/+]{40})(?:[\x60\x27"\s;]|\\[nr]|$)'

      # OpenAI-style API key: `sk-` or `sk-proj-` and a long opaque body.
      - label: secret:openai-key
        validator: none
        retry_trim: false
        pattern: '(?<![A-Za-z0-9_-])sk-(?:proj-)?[A-Za-z0-9_-]{20,}(?![A-Za-z0-9_-])'

      # GitHub personal / OAuth / server / user / refresh token — and the
      # fine-grained personal access token, `github_pat_` + 82 word characters,
      # the shape GitHub publishes for it. The head-to-head (ADR 0030) found the
      # `gh[pousr]_` rule blind to it — a real gap, closed under ADR 0030 Am. 1.
      # The measured price is ONE of gitleaks' 339 negatives: a `github_pat_xxx…`
      # placeholder that gitleaks' entropy floor discards and that limes, which
      # has no entropy gate by measurement (ADR 0021 Am. 2), reads as the format
      # it is.
      - label: secret:github-token
        validator: none
        retry_trim: false
        pattern: '(?<![A-Za-z0-9_-])(?:gh[pousr]_[A-Za-z0-9]{36,}(?![A-Za-z0-9])|github_pat_[A-Za-z0-9_]{82,}(?![A-Za-z0-9_]))'

      # Stripe secret and restricted keys, live and test alike: the format is the
      # claim, and a test key in a tool result is still a credential leaving.
      - label: secret:stripe-key
        validator: none
        retry_trim: false
        pattern: '(?<![A-Za-z0-9_-])[sr]k_(?:live|test)_[A-Za-z0-9]{24,}(?![A-Za-z0-9])'

      # Google API key.
      - label: secret:google-api-key
        validator: none
        retry_trim: false
        pattern: '(?<![A-Za-z0-9_-])AIza[0-9A-Za-z_-]{35}(?![A-Za-z0-9_-])'

      # Slack bot / user / workspace token, at the grammar Slack actually issues.
      #
      # This rule used to be `xox[baprse]-[A-Za-z0-9-]{10,}` — the prefix plus ten
      # of anything — and its corpus vector said so out loud: "the vendor prefix
      # IS the discriminant for this rule, not the segmented body". The external
      # bench priced that at **14 false positives**, every Slack lookalike gitleaks
      # ships: `xoxb-12345-abcd234`, `xoxa-access-token-string`,
      # `xoxb-xoxb-my-bot-token`, `xoxp-1234567890` (ADR 0021 Am. 2).
      #
      # The cause was not the rule alone. limes' own positive vector was
      # `xoxb-EXAMPLE-ONLY-SYNTHETIC-NOT-A-REAL-TOKEN`, which has no Slack token
      # shape at all — letters where the team and channel ids are digits — so the
      # rule had been loosened until it matched the corpus rather than the format.
      # Both are corrected together, and the replacement vectors are validated
      # against GITLEAKS' OWN patterns, not against this rule.
      - label: secret:slack-token
        validator: none
        retry_trim: false
        # The alternation is gitleaks' OWN slack grammars (MIT, attributed in
        # eval/corpus/gitleaks/PROVENANCE.md), transcribed case-explicitly rather
        # than re-derived. Writing it from a reading of the format instead cost
        # FOUR real formats — `xoxb-4938479689-9153451358` (a bot token with no
        # trailing body), the legacy two-segment bot token, `xoxe-7-…` and
        # `xoxa-7-nJL8ZjTG` — all of which the vendor's own rules accept and a
        # tidier-looking rule did not. Reuse, measured, is the whole positioning.
        pattern: '(?<![A-Za-z0-9-])(?:xoxb-[0-9]{10,13}-[0-9]{10,13}[A-Za-z0-9-]*|xoxb-[0-9]{8,14}-[A-Za-z0-9]{18,26}|xox[pe](?:-[0-9]{10,13}){3}-[A-Za-z0-9-]{28,34}|xox[os]-[0-9]+-[0-9]+-[0-9]+-[a-fA-F0-9]+|xox[ar]-(?:[0-9]-)?[0-9A-Za-z]{8,48}|[xX][oO][xX][eE].[xX][oO][xX][bBpP]-[0-9]-[A-Za-z0-9]{163,166}|[xX][oO][xX][eE]-[0-9]-[A-Za-z0-9]{146}|[xX][aA][pP][pP]-[0-9]-[A-Za-z0-9]+-[0-9]+-[a-z0-9]+)(?![A-Za-z0-9-])'

      # PEM private key. The span is the WHOLE BLOCK, not the armour line: a
      # finding that located only `-----BEGIN … PRIVATE KEY-----` would be masked
      # to exactly that and would forward the key material underneath it. If the
      # END line is missing the alternation swallows the rest of the content —
      # masking too much beats forwarding a truncated key. `CERTIFICATE` and
      # `PUBLIC KEY` armour is deliberately not matched: neither is a secret.
      # The validator is key MATERIAL, added after the external bench found the
      # armour alone firing on `-----BEGIN OPENSSH PRIVATE KEY----------END …-----`
      # (nothing between the lines) and on a block whose body is the word
      # `anything` (ADR 0021 Am. 2). Armour with no key under it is not a key. The
      # floor is 16 base64 characters, set by the FORMAT and not by this corpus:
      # the smallest real private key material — an Ed25519 seed, 32 bytes —
      # base64-encodes to 44 characters, so 16 sits far below any true key and far
      # above a word.
      - label: secret:private-key-pem
        validator: pem_key_material
        retry_trim: false
        pattern: '-----BEGIN (?:[A-Z][A-Z0-9 ]*)?PRIVATE KEY-----(?:[\s\S]*?-----END (?:[A-Z][A-Z0-9 ]*)?PRIVATE KEY-----|[\s\S]*)'

      # JSON Web Token. The three-dot-separated-base64url SHAPE is shared with
      # file names, version strings and package coordinates, so the shape alone
      # is worthless here — precision comes entirely from the validator, which
      # requires the first segment to decode to a JSON object declaring `alg`.
      - label: secret:jwt
        validator: jwt_header
        retry_trim: false
        pattern: '(?<![A-Za-z0-9_.-])[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{4,}\.[A-Za-z0-9_-]{4,}(?![A-Za-z0-9_.-])'

  # -- injection-egress (ADR 0012; admission: eval/matrices/injection_egress.md)
  #
  # Instructions ARRIVING on the server->host leg: poisoned tool descriptions
  # (tools/list) and indirect injection in tool results. Four categories, each
  # `validator: none` out loud — there is no checksum for a directive, so every
  # shape is scoped by markers, verbs and named sensitive sources instead, and
  # the benign corpus holds the lookalikes (quoted attack strings, lowercase
  # admonition tags, 'System:' status prose, dotfile config paths) that measure
  # the shapes' precision.
  injection-egress:
    max_content_chars: 200000
    # The languages these rules were written for (ADR 0028). The two shape-bound
    # detectors above declare none: a card number or a key has no language.
    locales: [fr, de, en]
    rules:

      # Uppercase attack markers (the Invariant Labs tool-poisoning shape).
      # Case-SENSITIVE: published attacks shout their tags, and the lowercase
      # <important> of ordinary documentation must survive.
      #
      # The body is bounded to 2 000 characters (ADR 0023). Unbounded, every
      # opening tag with no closing tag re-scanned the rest of the content:
      # 18 to 23 seconds on 200 000 characters of repeated open tags. A block
      # longer than that is not spanned by THIS rule; what it carries is still
      # read by every other rule in the file.
      - label: injection:hidden-tag
        validator: none
        retry_trim: false
        pattern: '<(?:IMPORTANT|HIDDEN|SECRET)>[\s\S]{0,2000}?</(?:IMPORTANT|HIDDEN|SECRET)>'

      # "Ignore previous instructions", one rule per language surface.
      - label: injection:ignore-instructions-en
        validator: none
        retry_trim: false
        pattern: '(?i)\bignore\s+(?:all\s+|any\s+)?(?:previous|prior|earlier)\s+(?:instructions|directives|rules)\b'
      - label: injection:ignore-instructions-fr
        validator: none
        retry_trim: false
        pattern: '(?i)\bignore[sz]?\s+(?:toutes\s+les\s+|les\s+)?(?:instructions|consignes|directives)\s+précédentes\b'
      - label: injection:ignore-instructions-de
        validator: none
        retry_trim: false
        pattern: '(?i)\bignoriere\s+(?:alle\s+)?(?:vorherigen|bisherigen|früheren)\s+(?:anweisungen|instruktionen|regeln)\b'

      # Embedded SYSTEM: directive (the Tessera case-08 trick, on this leg).
      # Uppercase-sensitive so 'System:' status prose survives; the span stops
      # at a quote or line end, which is where the smuggled directive ends.
      - label: injection:embedded-system-directive
        validator: none
        retry_trim: false
        pattern: "\\bSYSTEM\\s*:[ \\t][^\"'«»„“”\\n]{4,60}"

      # -- Three families added after the first external measurement (ADR 0017).
      # The rules above blocked 1.8% of garak's indirect injections. The cause was
      # not "rules cannot do this": it was that the outbound leg carried ONE
      # override phrasing while the inbound leg carried several, and that two
      # attack shapes present in the corpus had no rule at all. Each family below
      # is named by its shape, not by a string, and each arrived with the benign
      # lookalikes that measure its precision (see injection_benign.json).

      # An override AND the instruction it substitutes. Three parts, all required:
      # a disregard verb, a reference to the surrounding instructions or content,
      # and an imperative to do something else. The third part is the precision:
      # "please ignore the previous email" has the first two and is not an attack.
      - label: injection:override-and-substitute-en
        validator: none
        retry_trim: false
        pattern: '(?i)\b(?:ignore|disregard|forget|skip)\b[^.\n]{0,60}?\b(?:instructions?|directions?|directives?|rules?|prompts?|guidelines?|above|preceding|previous|prior|earlier|rest\s+of\s+(?:this|the)\s+\w+|this\s+data|the\s+data|other\s+content|all\s+(?:info|information|content))\b[^.\n]{0,60}?\b(?:print|say|repeat|reply|respond|output|translate|focus)\b'

      # A conversation turn smuggled into content the model is reading: a chat
      # role on its own line, mid-document, issuing an instruction. The leading
      # newline is load-bearing — a transcript a tool legitimately returns opens
      # with a role marker; an injected turn appears after the document has begun.
      - label: injection:injected-dialogue-turn
        validator: none
        retry_trim: false
        pattern: '(?im)\n[ \t>]*(?:user|assistant|system|human|ai)\s*:[^\n]{0,80}?\b(?:ignore|disregard|forget|repeat|print|say|reply|respond|output|write|translate|report|focus)\b'

      # A fabricated end-of-context marker: the attack tells the model the real
      # input stopped here, so what follows reads as a fresh, trusted turn.
      - label: injection:session-boundary-marker
        validator: none
        retry_trim: false
        pattern: '(?i)<\s*(?:end\s+of\s+(?:session|prompt|input|document|context|conversation)|/(?:system|prompt|context|instructions?)|(?:system|prompt|context)\s+(?:end|stop))\s*>'

      # A tool asking the model to keep its principal in the dark.
      - label: injection:concealment-en
        validator: none
        retry_trim: false
        pattern: '(?i)\b(?:do\s+not|don''t|never)\s+(?:tell|mention|inform|reveal|show)\b[^.\n]{0,60}?\buser\b'
      - label: injection:concealment-hide-en
        validator: none
        retry_trim: false
        pattern: '(?i)\bhide\s+(?:this|it)\s+from\s+the\s+user\b'
      - label: injection:concealment-fr
        validator: none
        retry_trim: false
        pattern: '(?i)\bne\s+(?:le\s+|la\s+|les\s+)?(?:mentionne|dis|révèle|signale)[sz]?\s+(?:pas|jamais)\b[^.\n]{0,60}?\butilisateur\b'
      - label: injection:concealment-de
        validator: none
        retry_trim: false
        pattern: '(?i)\berwähne\b[^.\n]{0,60}?\b(?:nutzer|benutzer)\b[^.\n]{0,30}?\bnicht\b'

      # A directive verb within reach of a NAMED sensitive source. The names
      # are the precision: '~/.config/…' plus 'pass' in one sentence is a
      # tool description, '.ssh' after 'read' is not.
      - label: injection:exfiltration
        validator: none
        retry_trim: false
        pattern: '(?i)\b(?:read|include|append|send|pass|attach|copy|transmets|envoie|ajoute|lis|füge|hänge|sende|lies)\b[^.\n]{0,80}?(?:\.ssh\b|id_rsa\b|credentials\b|\.env\b|api[_ -]?keys?\b|api-schlüssel\b|conversation\s+history\b|historique\s+de\s+la\s+conversation|mots?\s+de\s+passe|passwords?\b)'
