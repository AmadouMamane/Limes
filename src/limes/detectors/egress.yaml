# limes — egress detection policy (ADR 0004: rules are data, never Python).
#
# Every rule is a SHAPE plus a CHECK. The shape says which runs of text are even
# looked at; the check says whether the shape meant anything. The check is named
# from a closed registry (limes.detectors.egress_policy.VALIDATORS) — an unknown
# name is a load error, never a rule that matches a shape and vouches for nothing.
#
# `validator: none` is a rule declaring, out loud, that its shape is the whole
# claim. `retry_trim: true` lets a candidate that failed its check be retried
# after dropping its trailing group — prose runs an IBAN into the next word, and
# the retry can only ever SHORTEN a candidate, never loosen the check.
#
# The half of a label before the colon is the egress KIND the transport policies
# by (ADR 0006): `pii:pan` is kind `pii`.
#
# The corpus that admits these rules is synthetic by construction and may never
# hold a real value (ADR 0009).

version: 1

detectors:

  # -- pii-egress (ADR 0003 admission: eval/matrices/pii_egress.md) ------------
  #
  # Five fixed categories. Not configurable: a deployment that could add a
  # category could add one nobody measured, and an unmeasured category is a
  # capability claimed and never proven.
  pii-egress:
    # Beyond this many characters the detector does not scan, and says so:
    # DetectorBlind -> CannotSay -> the egress leg blocks. Declared here rather
    # than hard-coded because it is a real operational trade-off (an unbounded
    # regex sweep over an unbounded tool result is a denial-of-service surface),
    # and because "I did not look at this" must be auditable data, not a magic
    # number. Never a silent "nothing found" (ADR 0002).
    max_content_chars: 200000
    rules:

      # Card number. 13-19 digits with at most one space / no-break space /
      # hyphen between them, gated by the ISO/IEC 7812 check digit — which is
      # what tells a card number from a 16-digit order reference. The trailing
      # lookahead keeps it off decimal amounts (a ",45" tail marks money).
      - label: pii:pan
        validator: luhn
        retry_trim: false
        pattern: '(?<![A-Za-z0-9+])\d(?:[ \xa0-]?\d){12,18}(?![A-Za-z0-9]|[.,]\d)'

      # IBAN. Deliberately broad shape — two letters, two check digits, then up
      # to thirty grouped alphanumerics — because precision comes from MOD 97-10
      # (ISO 13616), not from the shape. `retry_trim` recovers the very common
      # case of prose running straight into the account number ("...0130 00 EUR").
      - label: pii:iban
        validator: iban_mod97
        retry_trim: true
        pattern: '\b[A-Z]{2}\d{2}(?:[ \xa0]?[A-Z0-9]){10,30}\b'

      # E-mail address. The shape IS the claim here: there is no checksum in an
      # address, and requiring a local part, an "@", a labelled domain and a
      # 2+-letter TLD is already what rejects "jean.dupont@" and "@example.com".
      - label: pii:email
        validator: none
        retry_trim: false
        pattern: '[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}'

      # Telephone: French, German, and E.164 international, as one category with
      # three alternatives. The check is a digit count in the E.164 range (9-15),
      # which is what keeps a date, a reference or an amount out of the findings.
      #
      # Kept on ONE line on purpose: a YAML folded scalar (`>-`) turns each line
      # break into a SPACE, which lands inside the regex and silently requires a
      # trailing space after every alternative. That shape passed the positive
      # corpus (prose usually has a space there) and would have missed a number
      # at the end of a sentence.
      - label: pii:phone
        validator: phone_digits
        retry_trim: false
        pattern: '(?<![A-Za-z0-9+])(?:(?:\+33[ \xa0.-]?|0)[1-9](?:[ \xa0.-]?\d{2}){4}|(?:\+49[ \xa0.-]?|0)[1-9]\d{1,4}[ \xa0./-]?\d{3,9}|\+[1-9]\d{0,2}[ \xa0.-]?(?:\d[ \xa0.-]?){5,12}\d)(?![A-Za-z0-9])'

      # French social-security number (NIR). Fifteen characters, the last two a
      # control key equal to 97 - (body mod 97) — with Corsica's 2A / 2B
      # department codes substituted before the arithmetic.
      - label: pii:nir
        validator: nir_key
        retry_trim: false
        pattern: '(?<![A-Za-z0-9])[12][ \xa0.]?\d{2}[ \xa0.]?\d{2}[ \xa0.]?(?:\d{2}|2[AB])[ \xa0.]?\d{3}[ \xa0.]?\d{3}[ \xa0.]?\d{2}(?![A-Za-z0-9])'

  # -- secrets-egress (ADR 0003 admission: eval/matrices/secrets_egress.md) ----
  #
  # PREFIXED credentials only, plus PEM private-key armour and JWTs. What is
  # DELIBERATELY absent is the obvious feature: generic high-entropy scanning.
  # A UUID, a git digest, a base64 blob and a content hash are all high-entropy
  # and none is a secret, so an entropy rule with no context is a false-positive
  # generator that teaches its operator to switch the detector off. It is
  # deferred, not forgotten, and the README says so rather than implying coverage
  # limes does not have.
  #
  # Consequence, stated: an unprefixed credential — an AWS *secret access key*, a
  # database password, a bare bearer token — is NOT detected. The benign corpus
  # is what proves the rules that are here do not fire on the lookalikes.
  secrets-egress:
    max_content_chars: 200000
    rules:

      # AWS access key id. The four-letter type prefix is assigned by AWS and is
      # what makes this high-precision without a checksum: twenty upper-case
      # alphanumerics on their own are an order code, `AKIA` + sixteen is a key.
      - label: secret:aws-access-key-id
        validator: none
        retry_trim: false
        pattern: '(?<![A-Za-z0-9])(?:AKIA|ASIA|ABIA|ACCA|AGPA|AIDA|AIPA|ANPA|ANVA|AROA)[0-9A-Z]{16}(?![A-Za-z0-9])'

      # OpenAI-style API key: `sk-` or `sk-proj-` and a long opaque body.
      - label: secret:openai-key
        validator: none
        retry_trim: false
        pattern: '(?<![A-Za-z0-9_-])sk-(?:proj-)?[A-Za-z0-9_-]{20,}(?![A-Za-z0-9_-])'

      # GitHub personal / OAuth / server / user / refresh token.
      - label: secret:github-token
        validator: none
        retry_trim: false
        pattern: '(?<![A-Za-z0-9_-])gh[pousr]_[A-Za-z0-9]{36,}(?![A-Za-z0-9])'

      # Stripe secret and restricted keys, live and test alike: the format is the
      # claim, and a test key in a tool result is still a credential leaving.
      - label: secret:stripe-key
        validator: none
        retry_trim: false
        pattern: '(?<![A-Za-z0-9_-])[sr]k_(?:live|test)_[A-Za-z0-9]{24,}(?![A-Za-z0-9])'

      # Google API key.
      - label: secret:google-api-key
        validator: none
        retry_trim: false
        pattern: '(?<![A-Za-z0-9_-])AIza[0-9A-Za-z_-]{35}(?![A-Za-z0-9_-])'

      # Slack bot / user / app / workspace token.
      - label: secret:slack-token
        validator: none
        retry_trim: false
        pattern: '(?<![A-Za-z0-9-])xox[baprse]-[A-Za-z0-9-]{10,}(?![A-Za-z0-9-])'

      # PEM private key. The span is the WHOLE BLOCK, not the armour line: a
      # finding that located only `-----BEGIN … PRIVATE KEY-----` would be masked
      # to exactly that and would forward the key material underneath it. If the
      # END line is missing the alternation swallows the rest of the content —
      # masking too much beats forwarding a truncated key. `CERTIFICATE` and
      # `PUBLIC KEY` armour is deliberately not matched: neither is a secret.
      - label: secret:private-key-pem
        validator: none
        retry_trim: false
        pattern: '-----BEGIN (?:[A-Z][A-Z0-9 ]*)?PRIVATE KEY-----(?:[\s\S]*?-----END (?:[A-Z][A-Z0-9 ]*)?PRIVATE KEY-----|[\s\S]*)'

      # JSON Web Token. The three-dot-separated-base64url SHAPE is shared with
      # file names, version strings and package coordinates, so the shape alone
      # is worthless here — precision comes entirely from the validator, which
      # requires the first segment to decode to a JSON object declaring `alg`.
      - label: secret:jwt
        validator: jwt_header
        retry_trim: false
        pattern: '(?<![A-Za-z0-9_.-])[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{4,}\.[A-Za-z0-9_-]{4,}(?![A-Za-z0-9_.-])'

  # -- injection-egress (ADR 0012; admission: eval/matrices/injection_egress.md)
  #
  # Instructions ARRIVING on the server->host leg: poisoned tool descriptions
  # (tools/list) and indirect injection in tool results. Four categories, each
  # `validator: none` out loud — there is no checksum for a directive, so every
  # shape is scoped by markers, verbs and named sensitive sources instead, and
  # the benign corpus holds the lookalikes (quoted attack strings, lowercase
  # admonition tags, 'System:' status prose, dotfile config paths) that measure
  # the shapes' precision.
  injection-egress:
    max_content_chars: 200000
    rules:

      # Uppercase attack markers (the Invariant Labs tool-poisoning shape).
      # Case-SENSITIVE: published attacks shout their tags, and the lowercase
      # <important> of ordinary documentation must survive.
      - label: injection:hidden-tag
        validator: none
        retry_trim: false
        pattern: '<(?:IMPORTANT|HIDDEN|SECRET)>[\s\S]*?</(?:IMPORTANT|HIDDEN|SECRET)>'

      # "Ignore previous instructions", one rule per language surface.
      - label: injection:ignore-instructions-en
        validator: none
        retry_trim: false
        pattern: '(?i)\bignore\s+(?:all\s+|any\s+)?(?:previous|prior|earlier)\s+(?:instructions|directives|rules)\b'
      - label: injection:ignore-instructions-fr
        validator: none
        retry_trim: false
        pattern: '(?i)\bignore[sz]?\s+(?:toutes\s+les\s+|les\s+)?(?:instructions|consignes|directives)\s+précédentes\b'
      - label: injection:ignore-instructions-de
        validator: none
        retry_trim: false
        pattern: '(?i)\bignoriere\s+(?:alle\s+)?(?:vorherigen|bisherigen|früheren)\s+(?:anweisungen|instruktionen|regeln)\b'

      # Embedded SYSTEM: directive (the Tessera case-08 trick, on this leg).
      # Uppercase-sensitive so 'System:' status prose survives; the span stops
      # at a quote or line end, which is where the smuggled directive ends.
      - label: injection:embedded-system-directive
        validator: none
        retry_trim: false
        pattern: "\\bSYSTEM\\s*:[ \\t][^\"'«»„“”\\n]{4,60}"

      # -- Three families added after the first external measurement (ADR 0017).
      # The rules above blocked 1.8% of garak's indirect injections. The cause was
      # not "rules cannot do this": it was that the outbound leg carried ONE
      # override phrasing while the inbound leg carried several, and that two
      # attack shapes present in the corpus had no rule at all. Each family below
      # is named by its shape, not by a string, and each arrived with the benign
      # lookalikes that measure its precision (see injection_benign.json).

      # An override AND the instruction it substitutes. Three parts, all required:
      # a disregard verb, a reference to the surrounding instructions or content,
      # and an imperative to do something else. The third part is the precision:
      # "please ignore the previous email" has the first two and is not an attack.
      - label: injection:override-and-substitute-en
        validator: none
        retry_trim: false
        pattern: '(?i)\b(?:ignore|disregard|forget|skip)\b[^.\n]{0,60}?\b(?:instructions?|directions?|directives?|rules?|prompts?|guidelines?|above|preceding|previous|prior|earlier|rest\s+of\s+(?:this|the)\s+\w+|this\s+data|the\s+data|other\s+content|all\s+(?:info|information|content))\b[^.\n]{0,60}?\b(?:print|say|repeat|reply|respond|output|translate|focus)\b'

      # A conversation turn smuggled into content the model is reading: a chat
      # role on its own line, mid-document, issuing an instruction. The leading
      # newline is load-bearing — a transcript a tool legitimately returns opens
      # with a role marker; an injected turn appears after the document has begun.
      - label: injection:injected-dialogue-turn
        validator: none
        retry_trim: false
        pattern: '(?im)\n[ \t>]*(?:user|assistant|system|human|ai)\s*:[^\n]{0,80}?\b(?:ignore|disregard|forget|repeat|print|say|reply|respond|output|write|translate|report|focus)\b'

      # A fabricated end-of-context marker: the attack tells the model the real
      # input stopped here, so what follows reads as a fresh, trusted turn.
      - label: injection:session-boundary-marker
        validator: none
        retry_trim: false
        pattern: '(?i)<\s*(?:end\s+of\s+(?:session|prompt|input|document|context|conversation)|/(?:system|prompt|context|instructions?)|(?:system|prompt|context)\s+(?:end|stop))\s*>'

      # A tool asking the model to keep its principal in the dark.
      - label: injection:concealment-en
        validator: none
        retry_trim: false
        pattern: '(?i)\b(?:do\s+not|don''t|never)\s+(?:tell|mention|inform|reveal|show)\b[^.\n]{0,60}?\buser\b'
      - label: injection:concealment-hide-en
        validator: none
        retry_trim: false
        pattern: '(?i)\bhide\s+(?:this|it)\s+from\s+the\s+user\b'
      - label: injection:concealment-fr
        validator: none
        retry_trim: false
        pattern: '(?i)\bne\s+(?:le\s+|la\s+|les\s+)?(?:mentionne|dis|révèle|signale)[sz]?\s+(?:pas|jamais)\b[^.\n]{0,60}?\butilisateur\b'
      - label: injection:concealment-de
        validator: none
        retry_trim: false
        pattern: '(?i)\berwähne\b[^.\n]{0,60}?\b(?:nutzer|benutzer)\b[^.\n]{0,30}?\bnicht\b'

      # A directive verb within reach of a NAMED sensitive source. The names
      # are the precision: '~/.config/…' plus 'pass' in one sentence is a
      # tool description, '.ssh' after 'read' is not.
      - label: injection:exfiltration
        validator: none
        retry_trim: false
        pattern: '(?i)\b(?:read|include|append|send|pass|attach|copy|transmets|envoie|ajoute|lis|füge|hänge|sende|lies)\b[^.\n]{0,80}?(?:\.ssh\b|id_rsa\b|credentials\b|\.env\b|api[_ -]?keys?\b|api-schlüssel\b|conversation\s+history\b|historique\s+de\s+la\s+conversation|mots?\s+de\s+passe|passwords?\b)'
