[project]
name = "limes"
version = "0.9.1"
description = "The guard that can prove what it refused — a transport-agnostic, evidence-carrying policy guard for LLM agents."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "llm",
    "guardrail",
    "mcp",
    "prompt-injection",
    "tool-policy",
    "pii",
    "audit",
    "evidence",
    "agent-security",
    "ai-safety",
]
authors = [{ name = "Amadou Mamane" }]
classifiers = [
    # Pre-1.0 by choice: the surface is complete; what's missing is the
    # real-world usage needed to earn a 1.0 (see the README). Alpha, honestly,
    # not Beta.
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    # No "License :: OSI Approved ::" classifier: PEP 639 makes it mutually
    # exclusive with the `license = "Apache-2.0"` expression above, which is the
    # authoritative one (Metadata 2.4+). PyPI still accepts both today; declaring
    # the licence twice, in two vocabularies, is the thing that can drift.
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    # 6.0.1, not 6.0. PyYAML 6.0 publishes no cp312/cp313/cp314 wheel at all, so
    # on every Python limes supports it falls back to its sdist — and that build
    # dies under Cython 3 ("'build_ext' object has no attribute 'cython_sources'").
    # A floor nobody can install is not a floor: `uv pip install --resolution
    # lowest limes` was simply broken. 6.0.1 is the first release that installs
    # and runs on 3.12, 3.13 and 3.14 — measured on all three, not assumed.
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
# The MCP stdio proxy transport (ADR 0005). NEVER a core dependency: `pip install
# limes` stays at one dependency (PyYAML); the proxy is `pip install limes[mcp]`.
# A ratchet (tests/unit/test_frontier.py) asserts `mcp` is absent from
# [project].dependencies and that no module outside transports/mcp/ imports it.
mcp = ["mcp>=1.28,<2"]
# The MCP Streamable HTTP proxy transport (ADR 0007). It reuses the stdio proxy's
# decision (Relay) and adds only HTTP plumbing, most of it the SDK's own session
# manager. `mcp` already depends on starlette + uvicorn, so this extra pins the
# ASGI server explicitly and is otherwise `limes[mcp]` — `limes[http]` ⊇ `limes[mcp]`.
http = ["mcp>=1.28,<2", "uvicorn>=0.31.1"]

# `limes` is the command dispatcher: `limes check` runs the pipeline over a file
# or stdin (core only, no extra), and `limes proxy` guards an MCP server (needs
# the `mcp` extra). The dispatcher imports the proxy only on the `proxy` path, so
# `limes check` stays free of the SDK. `limes-proxy` is the bare proxy entry.
[project.scripts]
limes = "limes.cli:main"
limes-proxy = "limes.transports.mcp.cli:main_proxy"

[project.urls]
Homepage = "https://github.com/AmadouMamane/Limes"
Repository = "https://github.com/AmadouMamane/Limes"
Issues = "https://github.com/AmadouMamane/Limes/issues"
Changelog = "https://github.com/AmadouMamane/Limes/blob/main/CHANGELOG.md"

# Detectors are discovered as plugins (ADR 0004). The canonical admitted set is
# the code tuple limes.detectors.ADMITTED; a test asserts these entry points and
# that tuple name the same detectors, so neither can drift from the other.
[project.entry-points."limes.detectors"]
injection = "limes.detectors.injection:InjectionDetector"
pii-egress = "limes.detectors.pii_egress:PiiEgressDetector"
secrets-egress = "limes.detectors.secrets_egress:SecretsEgressDetector"
injection-egress = "limes.detectors.injection_egress:InjectionEgressDetector"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "types-pyyaml>=6.0",
    # The MCP SDK is an OPTIONAL extra for users (limes[mcp]) and a DEV
    # dependency here, so the gate actually RUNS the proxy's tests. A suite that
    # skips its own definition of done reads green over a hole (ADR 0002).
    "mcp>=1.28,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `packages` already ships every file under src/limes — including the default
# corpus (src/limes/corpus/**), the policy YAML, and py.typed. Do NOT add a
# force-include for the corpus: it re-adds those files at the same wheel path and
# hatchling fails the build on the collision.
packages = ["src/limes"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "PT",   # pytest style
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "D",    # pydocstyle
    "ANN",  # annotations
]
ignore = [
    "D203",  # one-blank-line-before-class (conflicts with D211)
    "D213",  # multi-line-summary-second-line (conflicts with D212)
    "D105",  # magic methods document themselves by name
    "D107",  # __init__ is documented by its class docstring
    "N818",  # domain exception names (Blocked, DetectorBlind) read better than an -Error suffix
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests need neither module docstrings nor full annotations to be readable.
"tests/**" = ["D", "ANN", "PT011"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
# Tests are checked, but leniently: they may omit return annotations and call
# pytest's untyped helpers without ceremony. Source (src/) stays fully strict.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
disallow_untyped_calls = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "mutation: a ratchet that must be seen RED under a named source mutation (a ratchet never seen red is not a ratchet).",
]
