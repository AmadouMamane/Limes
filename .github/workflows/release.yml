name: release

# Publishing is deliberate: a tag, or a hand-pulled lever. Never a push to main.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "where to publish"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  # The gate runs again here, on the exact tag, rather than trusting that the
  # commit was green when it landed: a tag can be moved, and the thing published
  # must be the thing judged (ADR 0026 — a witness interrogates the thing).
  gate:
    name: gate before publishing — py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the frontier ratchet reads v0.1's bytes from history
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync
      - run: make gate

  build:
    name: build sdist + wheel
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5

      - name: Build
        run: uv build

      - name: The tag and the version must be the same number
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          built="$(uv run --no-project --with tomli python -c \
            'import tomli;print(tomli.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "tag=$tag  pyproject=$built"
          # A tag that names a different version than the artifact it publishes is
          # a release nobody can trace back: the sdist would claim one number and
          # the git history another.
          test "$tag" = "$built"

      - name: Metadata must render on PyPI
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write          # Trusted Publishing (OIDC): no token on any machine
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: publish to PyPI
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # Trusted Publishing (OIDC): no token on any machine
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
