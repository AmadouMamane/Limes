name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (ruff · mypy --strict · pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Pin Python (from .python-version)
        run: uv python install

      - name: Sync dependencies
        run: uv sync

      - name: Gate — ruff + ruff format --check + mypy --strict + pytest
        run: make gate
